name: Update profile art
on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/**", "data/portrait.txt", ".github/workflows/update-profile-art.yml"]
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r scripts/requirements-ci.txt
      - run: python scripts/fetch_contributions.py
      # Public profile data only, so the built-in token is enough (no PAT).
      - run: python scripts/gen_live.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json data/github.json art/activity-*.svg art/numbers-*.svg art/languages-*.svg art/status-*.svg art/skyline-*.svg art/flap-*.svg"
